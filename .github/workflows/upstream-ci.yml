# Reproduces alibaba/open-code-review .github/workflows/ci.yml at
# 1672852136fc87748249d22bce0819f33419ea79 (tag v1.13.0) with allowed deviations A1–A3 only.
# A1: self-hosted -> ubuntu-24.04 for test and cross-compile
# A2: checkout submodules: true; every run: has working-directory: upstream
# A3: on.push/on.pull_request paths-ignore and branches: [main] unchanged

name: upstream-ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**/LICENSE"
      - "**/.gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**/LICENSE"
      - "**/.gitignore"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: golang:1.26.9
      options: --cpus=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'
        working-directory: upstream
      - name: Verify generated provider presets
        run: go run ./internal/llm/gen -check -output extensions/frontend/src/shared/providers.generated.ts -kotlin-output
          extensions/idea/src/main/kotlin/com/alibaba/opencodereview/idea/services/ProviderNames.generated.kt
        working-directory: upstream
      - name: Verify license headers
        run: bash scripts/verify-license.sh
        working-directory: upstream
      - name: Verify action pins
        run: bash scripts/verify-action-pins.sh
        working-directory: upstream
      - name: Verify sources contain no unapproved non-English text
        run: go run scripts/verify-english-only.go
        working-directory: upstream
      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean. Run 'gofmt -s -w .' and commit:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi
        working-directory: upstream
      - name: Check line endings
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Line endings must be LF. Run 'git add --renormalize .' and commit the diff below."
            git diff --cached --stat
            exit 1
          fi
        working-directory: upstream
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the diff above."
            exit 1
          fi
        working-directory: upstream
      - name: Vet
        run: go vet ./...
        working-directory: upstream
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
        working-directory: upstream
      - name: Test with coverage
        env:
          OCR_DELEGATE_REQUIRE_PTY: "1"
        run: |
          go test -v -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total: | awk '{print $3}'
        working-directory: upstream
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 90)}"; then
            echo "FAIL: Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${COVERAGE}% meets 90% threshold"
        working-directory: upstream
      - name: Build
        run: go build -o ./opencodereview ./cmd/opencodereview
        working-directory: upstream
      - name: Smoke test
        run: |
          ./opencodereview --version
          ./opencodereview --version | grep -q "open-code-review"
          HELP=$(./opencodereview --help)
          echo "$HELP" | grep -q "Commands:"
          echo "$HELP" | grep -q "review"
          echo "$HELP" | grep -q "scan"
          echo "$HELP" | grep -q "delegate"
          echo "$HELP" | grep -q "config"
          echo "$HELP" | grep -q "auth"
          echo "$HELP" | grep -q "llm"
          echo "$HELP" | grep -q "viewer"
          echo "$HELP" | grep -q "session"
          echo "$HELP" | grep -q "rules"
          rm -f ./opencodereview
        working-directory: upstream
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true
      - name: Vet
        run: go vet ./...
        working-directory: upstream
      - name: Test
        run: go test -count=1 ./...
        working-directory: upstream
      - name: Test Node launcher
        run: npm run test:launcher
        working-directory: upstream
      - name: Build
        run: go build -o opencodereview.exe ./cmd/opencodereview
        working-directory: upstream
      - name: Smoke test
        shell: bash
        run: |
          ./opencodereview.exe --version
          ./opencodereview.exe --version | grep -q "open-code-review"
          HELP=$(./opencodereview.exe --help)
          echo "$HELP" | grep -q "Commands:"
          echo "$HELP" | grep -q "review"
          echo "$HELP" | grep -q "scan"
          echo "$HELP" | grep -q "delegate"
          echo "$HELP" | grep -q "config"
          echo "$HELP" | grep -q "auth"
          echo "$HELP" | grep -q "llm"
          echo "$HELP" | grep -q "viewer"
          echo "$HELP" | grep -q "session"
          echo "$HELP" | grep -q "rules"
          rm -f ./opencodereview.exe
        working-directory: upstream
  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: golang:1.26.9
      options: --cpus=2
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'
        working-directory: upstream
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./...
        working-directory: upstream
